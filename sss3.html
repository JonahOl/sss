<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC</title>
    <!--import p5js-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <!--import tonejs-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column; /*stack items vertically*/
            min-height: 100vh;
            background: #fff;
        }
        /*Black shape box at top of screen that holds shape patches icons*/
        #shape-box{
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 6px 14px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            height: 50px;
            flex-shrink: 0; /*don't compress when canvas grows*/
        }
        #shape-box > span, #shape-box > div > span:not(.shape-hoverbox){
            color: #888;
            font-family: monospace;
            font-size: 10px;
            margin-right: 4px;
        }
        /*#shape-box span{
            color: #888;
            font-family: monospace;
            font-size: 10px;
            margin-right: 4px;
        }*/
        /*shapes in shape box */
        .shape-box-item {
            cursor: grab;
            user-select: none;
            position: relative; /* placeholder*/
        }
        /*word show on hover*/
        .shape-box-item .shape-hoverbox{
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            background: rgb(170, 215, 133);
            color: #eee;
            font-family: monospace;
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 3px;
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s;
            z-index: 9999;

        }
        .shape-box-item:hover .shape-hoverbox{
            opacity:1;
        }
        .shape-box-item svg{
            display:block;
        }
        /*canvas fills rest of space scroll*/
        #sketch{
            height: calc(100vh - 250px);
            flex:none;
            position:relative;
            overflow-x: scroll;
            overflow-y:scroll;
        }
        /*text editor section at bottom*/
        #code-editor{
            flex: 0px 0px 160px;
            background: rgb(149, 153, 236);
            color: #fff;
            min-height: 200px;
            border: none;
            outline: none;
            padding: 10px;
            font-family:'Times New Roman', Times, serif;
            font-size: 10px;
            line-height: 1.5;
            resize: none;
            caret-color: white;
            width: 100%;
            box-sizing: border-box;
        }
        /*#code-bar{
            display: flex;
            padding: 8px;
            border-top: 1px solid #ccc;
            background: #fff
        }
        #code-input{
            flex:1;
            padding: 6px 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #code-input::placeholder{color: #aaa;}*/
        /*copy/delete bottom right*/
        #copy-button {
            position: fixed;
            bottom: 12px;
            right: 12px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s, background 0.15s;
            z-index: 999;
        }
        #copy-button:hover{
            opacity: 1;
            background: #333;
        }
        /*green when copied*/
        #copy-button.copied{
            background: #2a7a2a;
            border-color: #4caf50;
        }
        #delete-button {
            position: fixed;
            bottom: 12px;
            right: 80px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s, background 0.15s;
            z-index: 999;
        }
        #delete-button:hover{
            opacity: 1;
            background: #333;
        }
        /*green when deleted*/
        #delete-button.deleted{
            background: #2a7a2a;
            border-color: #4caf50;
        }
        /*pause play flipping button*/
        #pause-play{
            position: fixed;
            bottom: 12px;
            right: 160px;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #pause-play:hover{
            opacity: 1;
            background: #333;
        }
        /*save/load on canvas top right*/
        #save-button{
            position: fixed;
            top: 65px;
            right: 60px;
            background: #eee8e8;
            color: rgb(0, 0, 0);
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #save-button:hover{
            opacity: 1;
            background: #333;
        }
        #save-button.saved{
            background: #2a7a2a;
            border-color: #4caf50;
        }
        #load-button{
            position: fixed;
            top: 65px;
            right: 10px;
            background:  #eee8e8;
            color: rgb(0, 0, 0);
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #load-button:hover{
            opacity: 1;
            background: #333;
        }
        #load-button.saved{
            background: #2a7a2a;
            border-color: #4caf50;
        }
        #new-page-button{
            position:fixed;
            top: 65px;
            right:115px;
            background: #eee8e8;
            color:rgb(0, 0, 0);
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #new-page-button:hover{opacity:1; background: #333; color: #fff;}
        #mute-button{
            position: fixed;
            top: 65px;
            right: 170px;
            background:#eee8e8;
            color: rgb(0,0,0);
            border: 1px solid #444;
            padding:4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius:3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #mute-button:hover{opacity:1; background: #333;}
        #restart-button{
            position: fixed;
            top: 65px;
            left: 10px;
            background: #eee8e8;
            color: rgb(0,0,0);
            border: 1px solid #444;
            padding: 4px 10px;
            font-family: monospace;
            font-size: 11px;
            cursor: pointer;
            border-radius: 3px;
            opacity: 0.75;
            transition: opacity 0.15s;
            z-index: 999;
        }
        #restart-button:hover{opacity:1; background: #333; color: #fff;}
        /*speed canvas bottom right*/
        #speed-buttons{
            position: absolute;
            top: 65px;
            right: 240px;
            display: flex;
            gap: 4px;
            z-index: 10;
        }
        .speed-btn{
            background: #97f3e0;
            color: #666;
            border: 1px solid #2a2a2a;
            padding: 3px 7px;
            font-family: monospace;
            font-size: 10px;
            cursor: pointer;
            border-radius: 2px;
            transition: color 0.1s, border-color 0.1s;
        }
        .speed-btn:hover {color: #ccc; border-color: rgb(155, 237, 226);}
        .speed-btn.active{color: rgb(0, 0, 0); border-color: #dc3545;}
        #dragging-translucent{
            position: fixed;
            pointer-events: none;
            display: none;
            z-index: 9999;
            opacity: 0.5;
        }
        #help-overlay{
            position: absolute;
            top:0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background-image: url('Untitled (3).png');
            background-repeat: no-repeat;
            background-size: contain;
            transition: opacity 0.5s;
        }
    </style>
</head>

            function createEffects(effects){
                return effects.map(effect =>{
                    if (effect === 'vibrato') return new Tone.Vibrato({ frequency: 5, depth: 0.5}).toDestination();
                    if (effect === 'distortion') return new Tone.Distortion(0.8).toDestination();
                    if (effect === 'reverb') return new Tone.Reverb({decay: 3, wet: 0.7}).toDestination();
                    return null;
                }).filter(Boolean);
            }

        function drawGradient(x, y, w, h){
            let gradient = drawingContext.createLinearGradient(x + w * 0.5, 0, x + w, 0);
            gradient.addColorStop(0, 'rgba(255,255,255,0)');
            gradient.addColorStop(1, 'rgba(255,255,255,0.6)');
            drawingContext.fillStyle = gradient;
            drawingContext.fillRect(x + w * 0.5, y, w * 0.5, h);
        }

        function drawGradientReverse(x, y, w, h){
            let gradient = drawingContext.createLinearGradient(x, 0, x+w*0.5,0);
            gradient.addColorStop(0, 'rgba(255,255,255,0.6)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            drawingContext.fillStyle = gradient;
            drawingContext.fillRect(x, y, w*0.5,h);
        }
        function noteHeight(){return height/notes.length;}
        function shapeHeight(s){
            if (s.type === 'arptriangle'){
                return (s.span || 1) * noteHeight();
            
            }
            return 100;
        }
        function draw() {
            background(255);//white canvas
            if (gridVisible){
            stroke(200); 
            strokeWeight(0.5);//grid lines
            const gridSize = windowWidth/32;//32 squared grid across
            for (let x = 0; x < width; x += gridSize) line(x, 0, x, height);
            for (let y = 0; y < height; y += gridSize) line (0, y, width, y);
            }
            //page divider lines
            for (let p = 1; p < totalPages; p++){
                stroke(180,180, 255);
                strokeWeight(2);
                line(p * windowWidth, 0, p* windowWidth, height);
            }
            //page numbers
            for (let p = 0; p < totalPages; p++){
                fill(180, 180, 255);
                noStroke();
                textSize(30);
                textAlign(RIGHT);
                text(p+1,(p+1)*windowWidth-8, height-60);
            }
            //notes left side
            const sketchScroll = document.getElementById('sketch').scrollLeft;
            for (let i = 0; i < notes.length; i++){
                const y = (i/notes.length) * height + (height/notes.length/2);
                const activeIdx = draggingIndex !== -1 ? draggingIndex: (selectedShape !== -1 ? selectedShape: -1);
                const highlightNote = activeIdx !== -1
                ? Math.min(Math.floor(((resolveValue(shapes[activeIdx].y) + shapeHeight(shapes[activeIdx]) / 2) / height) * notes.length), notes.length - 1)
                : -1;
            if ( i === highlightNote){
                fill(0, 0, 255);
                textSize(11);
                noStroke();
                rect(sketchScroll, y - 7, 22, 13);
                fill(255);
            }else{
                fill(180);
            }
                noStroke();
                textSize(10);
                textAlign(LEFT);
                text(notes[i], sketchScroll +4, y);
            
            }
            noStroke();
            
            //scanline motion
            let previous = scanline;
            if (playing == true) {scanline += SCAN_SPEED * speedMultiplier};
            
            if (scanline > width) scanline = 0;
            if (scanline < previous){
                activeShapes.forEach(i => triggerRelease(shapes[i]));
                activeShapes.clear();
            }
            noStroke();
            
            //draw each shapes
            for (let si = 0; si < shapes.length; si++){
                //Square
                let s = shapes[si]
                const sx = resolveValue(s.x);
                const sy = resolveValue(s.y);
                const sw = resolveValue(s.w);
                const alpha = shapeAlpha(s);
                const a255 = Math.round(alpha * 255);
            if (s.type === 'square'){
            fill(255, 0, 0, a255);
            rect(sx, sy, sw, 100);
            if (alpha > 0) {
                if (s.effects.includes('reverse')) drawGradientReverse (sx, sy, sw, 100);
                else drawGradient(sx, sy, sw, 100);

            }
            }
            //Triangle
            else if (s.type === 'triangle'){
            fill(0, 255, 0, a255);
            triangle(sx, sy +100, sx - sw/2, sy, sx + sw/2, sy);
            drawingContext.save();
            drawingContext.beginPath();
            drawingContext.moveTo(sx, sy + 100);
            drawingContext.lineTo(sx - sw/2, sy);
            drawingContext.lineTo(sx + sw/2, sy);
            drawingContext.closePath();
            drawingContext.clip();
            if (alpha > 0){
                if (s.effects.includes('reverse')) drawGradientReverse (sx - sw/2, sy, sw, 100);
                else drawGradient(sx - sw/2, sy, sw, 100);
            
            }
            drawingContext.restore();
            }
            //Circle (Sine)
            else if (s.type === 'circle'){
                fill(0, 0, 255, a255);
                ellipse(sx, sy, sw, 100);
                drawingContext.save();
                drawingContext.beginPath();
                drawingContext.ellipse(sx, sy, sw/2, 50, 0, 0, Math.PI *2);
                drawingContext.clip();
                if (alpha > 0) {
                if (s.effects.includes('reverse')) drawGradientReverse (sx - sw/2, sy - 50, sw, 100);   
                else drawGradient(sx - sw/2, sy - 50, sw, 100);
                
            }   drawingContext.restore();
            }
            //right angled triangle(arpeggiator)
            else if (s.type === 'arptriangle'){
                const sh = shapeHeight(s);
                fill(255, 165, 0, a255);
                triangle(sx, sy + sh, sx + sw, sy, sx + sw, sy +sh);
                drawingContext.save();
                drawingContext.beginPath();
                drawingContext.moveTo(sx, sy + sh);
                drawingContext.lineTo(sx + sw, sy);

    }   
        //returns start of shape
        function shapeStart(s){
            const sx = resolveValue(s.x);
            const sw = resolveValue(s.w);
            if (s.type === 'square'){
                return sx;
            }
            if (s.type === 'triangle'){
                return sx - sw/2;
            }
            if (s.type === 'circle'){
                return sx - sw/2;
            }
            if (s.type === 'arptriangle'){
                return sx;
            }
            if (s.type === 'diamond'){
                return sx;
            }
            if (s.type === 'sawtooth'){
                return sx;
            }
            return sx;
        }
        //returns end of shape
        function shapeEnd(s){
            const sx = resolveValue(s.x);
            const sw = resolveValue(s.w);
            if(s.type === 'square') return sx + sw;
            if (s.type === 'triangle') return sx + sw/2;
            if (s.type === 'circle') return sx + sw/2;
            if (s.type === 'arptriangle') return sx + sw;
            if (s.type === 'diamond') return sx + sw;
            if (s.type === 'sawtooth') return sx + sw;
            return sx + sw;
        }

        //sound for shape
        function triggerShape(s){
            const notes = ['C5', 'B4', 'Bb4', 'A4', 'Ab4', 'G4', 'Gb4', 'F4', 'E4', 'Eb4', 'D4', 'Db4', 'C4', 'B3', 'Bb3', 'A3', 'Ab3', 'G3', 'Gb3', 'F3', 'E3', 'Eb3', 'D3', 'Db3', 'C3']
            const noteIndex = Math.floor((s.y/height)* notes.length);
            const pitch = notes[Math.min(noteIndex, notes.length -1)];
            if (s.type === 'square'){
                squareSynth.triggerAttackRelease(pitch,"8n");
            }
            if (s.type === 'triangle'){
                triangleSynth.triggerAttackRelease(pitch, "8n");
            }
            if (s.type === 'circle'){
                sineSynth.triggerAttackRelease (pitch, "8n");
            }
            //staggered notes
            if (s.type === 'arptriangle'){
                arpSynth.releaseAll();
                const baseIdx = Math.min(Math.floor((s.y/height) *notes.length), notes.length -1);
                const arpNotes = [
                    notes[baseIdx],
                    notes[Math.max(baseIdx - 2, 0)],
                    notes[Math.max(baseIdx - 4, 0)],
                    notes[Math.max(baseIdx - 7, 0)],
                ];
                arpNotes.forEach((note, i) => {
                    arpSynth.triggerAttackRelease(note, '16n', `+${i*0.1}`);
                });
            }
            if (s.type === 'diamond'){
                diamondSynth.triggerAttackRelease(pitch, "8n");
            }
        }

        function triggerAttack(s){
            const noteIndex = Math.min(Math.floor((resolveValue(s.y)/height) * notes.length), notes.length - 1);
            const pitch = notes[noteIndex];
            const vol = getEffectiveVol(s);
            if (s.type === 'square') {
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){squareSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(squareSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                squareSynth.volume.value = vol;
                const revSq = s.effects.includes('reverse');
                squareSynth.set({envelope:{attack: revSq ? (s.release||0.5) : (s.attack||0.01), release: revSq ? (s.attack||0.01) : (s.release||0.5)}});
                //squareSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){squareSynth.triggerAttack(pitch); s._activePitch = pitch;}
            }
            if (s.type === 'triangle'){
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){triangleSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(triangleSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                triangleSynth.volume.value = vol;
                const revTri = s.effects.includes('reverse');
                triangleSynth.set({envelope:{attack: revTri ? (s.release||0.5) : (s.attack||0.01), release: revTri ? (s.attack||0.01) : (s.release||0.5)}});
                //triangleSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){triangleSynth.triggerAttack(pitch); s._activePitch = pitch;}
            }
            if (s.type === 'circle'){
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){sineSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(sineSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                sineSynth.volume.value = vol;
                const revSin = s.effects.includes('reverse');
                sineSynth.set({envelope:{attack: revSin ? (s.release||0.5) : (s.attack||0.01), release: revSin ? (s.attack||0.01) : (s.release||0.5)}});
                //sineSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){sineSynth.triggerAttack(pitch); s._activePitch = pitch;}
            }
            //staggered notes
            if (s.type === 'arptriangle'){
                const sy = resolveValue(s.y);
                const baseIdx = Math.min(Math.floor((sy/height) *notes.length), notes.length -1);
                const span = s.span || 1;
                const arpNotes = Array.from({length:span}, (_, i) =>
                    notes[Math.max(baseIdx - i, 0)]
                );
                /*const arpNotes = [
                    notes[baseIdx],
                    notes[Math.max(baseIdx - 2, 0)],
                    notes[Math.max(baseIdx - 4, 0)],
                    notes[Math.max(baseIdx - 7, 0)],
                ];*/
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){arpSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(arpSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                arpSynth.volume.value = vol;
                const revArp = s.effects.includes('reverse');
                arpSynth.set({envelope:{attack: revArp ? (s.release||0.5) : (s.attack||0.01), release: revArp ? (s.attack||0.01) : (s.release||0.5)}});
                //arpSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){
                    arpNotes.forEach((note, i) => {
                        arpSynth.triggerAttackRelease(note, '16n', `+${i*0.1}`);
                });
            }
            }
            if (s.type === 'diamond'){
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){diamondSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(diamondSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                diamondSynth.volume.value = vol;
                const revDia = s.effects.includes('reverse');
                diamondSynth.set({envelope:{attack: revDia ? (s.release||0.5) : (s.attack||0.01), release: revDia ? (s.attack||0.01) : (s.release||0.5)}});
                //diamondSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){diamondSynth.triggerAttack(pitch); s._activePitch = pitch;}
            }
            if (s.type === 'sawtooth'){
                const fxKey = (s.effects || []).join('.');
                if (s._lastFxKey !== fxKey){
                if (s._activePitch){sawtoothSynth.triggerRelease(s._activePitch); s._activePitch = null; }
                applyEffects(sawtoothSynth, s.effects);
                s._lastFxKey = fxKey;
                }
                sawtoothSynth.volume.value = vol;
                const revSaw = s.effects.includes('reverse');
                sawtoothSynth.set({envelope:{attack: revSaw ? (s.release||0.5) : (s.attack||0.01), release: revSaw ? (s.attack||0.01) : (s.release||0.5)}});
                //sawtoothSynth.set({envelope:{attack: s.attack||0.01, release: s.release||0.5}});
                if (shapeAlpha(s) > 0){sawtoothSynth.triggerAttack(pitch); s._activePitch = pitch;}
            }
            //voice
            if (s.type === 'voice'){
                const label = s.label && s.label.trim() ? s.label.trim() :null;
                if (!label || shapeAlpha(s) === 0) return;
                const pitchRatio = 1 - (noteIndex / notes.length);
                const rateRatio = 150 / resolveValue(s.w);
                const utt = new SpeechSynthesisUtterance(label);
                utt.pitch = 0.1 + pitchRatio * 2;
                utt.rate = Math.max(0.1, Math.min(2, rateRatio));
                utt.volume = shapeAlpha(s);
                speechSynthesis.speak(utt);
            }
            //piano
            if (s.type === 'piano'){
                if (!sampleReady) return;
                const fxKey = (s.effects||[]).join('.');
                if (s._lastFxKey !== fxKey){applyEffectsToSample(pianoSample, s.effects); s._lastFxKey = fxKey;}
                pianoSample.volume.value = vol;
                const safePitch = Tone.Frequency(pitch).toMidi() < 21 ? 'A1' :
                  Tone.Frequency(pitch).toMidi() > 104 ? 'Gs7' : pitch;
                //const safePitch = Tone.Frequency(pitch).toMidi() < 36 ? 'C2' :
                //  Tone.Frequency(pitch).toMidi() > 72 ? 'C5' : pitch;
                if(shapeAlpha(s) >0){pianoSample.triggerAttack(safePitch); s._activePitch = safePitch;}
            }
            //violin
            if (s.type === 'violin'){
                if (!sampleReady) return;
                const fxKey = (s.effects||[]).join('.');
                if (s._lastFxKey !== fxKey){applyEffectsToSample(violinSample, s.effects); s._lastFxKey = fxKey;}
                violinSample.volume.value = vol;
                const safePitch = Tone.Frequency(pitch).toMidi() < 21 ? 'A1' :
                  Tone.Frequency(pitch).toMidi() > 104 ? 'Gs7' : pitch;
                //const safePitch = Tone.Frequency(pitch).toMidi() < 36 ? 'C2' :
                //  Tone.Frequency(pitch).toMidi() > 72 ? 'C5' : pitch;
                if(shapeAlpha(s) >0){violinSample.triggerAttack(safePitch); s._activePitch = safePitch;}
            }
            //flute
            if (s.type === 'flute'){
                if (!sampleReady) return;
                const fxKey = (s.effects||[]).join('.');
                if (s._lastFxKey !== fxKey){applyEffectsToSample(fluteSample, s.effects); s._lastFxKey = fxKey;}
                fluteSample.volume.value = vol;
                const safePitch = Tone.Frequency(pitch).toMidi() < 21 ? 'A1' :
                  Tone.Frequency(pitch).toMidi() > 104 ? 'Gs7' : pitch;
                //const safePitch = Tone.Frequency(pitch).toMidi() < 36 ? 'C2' :
                //  Tone.Frequency(pitch).toMidi() > 72 ? 'C5' : pitch;
                if(shapeAlpha(s) >0){fluteSample.triggerAttack(safePitch); s._activePitch = safePitch;}
            }
        }
        function triggerRelease(s){
            if (s.type === 'square') {
                if (s._activePitch){squareSynth.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'triangle') {
                if (s._activePitch){triangleSynth.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'circle') {
                if (s._activePitch){sineSynth.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'arptriangle') {
                arpSynth.releaseAll();
            }
            if (s.type === 'diamond'){
                if (s._activePitch){diamondSynth.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'sawtooth'){
                if (s._activePitch){sawtoothSynth.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'voice'){

            }
            if (s.type === 'piano'){
                if (s._activePitch){pianoSample.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'violin'){
                if (s._activePitch){violinSample.triggerRelease(s._activePitch); s._activePitch = null;}
            }
            if (s.type === 'flute'){

            if (!canvasFocus) return;
            if (key === 'g'){
                gridVisible = !gridVisible;
                return false;
            }
            if (key === 'q'){
                qHold = true;
                return false;
            }
            if (key === 'd'){
                const targets = multiSelect.size > 0 ? [...multiSelect] : (selectedShape !== -1 ? [selectedShape] : []);
                if (targets.length > 0){
                    const newIndices = [];
                    targets.forEach(idx => {
                        const orig = shapes[idx];
                        const copy = JSON.parse(JSON.stringify(orig)) ;
                        copy.x = {value: resolveValue(orig.x) + 20, animated: false};
                        copy._activePitch = null;
                        copy._lastFxKey = null;
                        shapes.push(copy);
                        newIndices.push(shapes.length - 1);
                    });
                    multiSelect = new Set(newIndices);
                    selectedShape = newIndices[newIndices.length - 1];
                    syncEditorFromShapes();
                }
                /*if (selectedShape !== -1){
                    const orig = shapes[selectedShape];

                    copy._activePitch = null;
                    copy._lastFxKey = null;
                    shapes.push(copy);
                    selectedShape = shapes.length - 1;
                    syncEditorFromShapes();
                }*/
                return false;
            }
            if (key === 'r'){
                rHold = true;
                return false;
            }
            if (key === '=' || key === '+'){
                zoomLevel = Math.min(2.0, zoomLevel + 0.1);
                applyZoom();
                return false;
            }
            if (key === 'h'){
                const overlay = document.getElementById('help-overlay');
                overlay.style.opacity = overlay.style.opacity === '0'? '1': '0';
                return false;
            }
            if (key === '-' || key === '_'){
                zoomLevel = Math.max(0.2, zoomLevel - 0.1);
                applyZoom();
                return false;
            }
            if (keyCode === BACKSPACE && selectedShape !== -1 && voiceIndex === -1){
                const targets = multiSelect.size > 0 ? [...multiSelect].sort((a,b)=>b-a) : (selectedShape !== -1 ? [selectedShape] : []);
                if (targets.length > 0){
                    targets.forEach(idx => {
                        triggerRelease(shapes[idx]);
                        activeShapes.delete(idx);
                    });
                    targets.sort((a,b)=>b-a).forEach(idx => shapes.splice(idx,1));
                    multiSelect.clear();
                    selectedShape = -1;
                    syncEditorFromShapes();
                }
                /*triggerRelease(shapes[selectedShape]);
                activeShapes.delete(selectedShape);
                shapes.splice(selectedShape, 1);
                selectedShape = -1;
                syncEditorFromShapes();*/
                return false;
            }
            if (key === ' ' && voiceIndex === -1){
                playing = !playing;
                document.getElementById('pause-play').textContent = playing ? 'pause' : 'play';
                return false;
            
            }
            if (voiceIndex === -1) return;
            let s = shapes[voiceIndex];
            if (keyCode === ENTER || keyCode === ESCAPE){
                if (!s.label) s.label = 'text';
                voiceIndex = -1;
            } else if (keyCode === BACKSPACE){
                s.label = (s.label || '').slice(0, -1);
            } else if (key.length === 1){
                s.label = (s.label || '') + key;
            }
            syncEditorFromShapes();
            return false;
        }

        //volume functions
        function shapeAlpha(s){
           // const v = (s.vol === undefined || s.vol === null) ? 100 : s.vol;
           // return Math.max(0,Math.min(100,v))/100;
           const v = s.vol;
           if (!v || v === null) return 1;
           if (!v.animated) return Math.max(0, Math.min(100, v.value ?? v))/100;
           const t = (millis() / 1000)%v.period;
           const norm = (Math.sin((t/v.period) *Math.PI*2 - Math.PI/2)+1)/2;
           return (v.min + (v.max - v.min)*norm)/100;
        }
        function alphaToDb(a){
            if (a <= 0) return -Infinity;
            return 20 * Math.log10(a);
        }
        function getSynthVolume(s){
            const alpha = shapeAlpha(s);
            return alphaToDb(alpha);
        }
        function getEffectiveVol(s){
            if (muted) return -Infinity;
            return getSynthVolume(s);
        }
        function parseVol(line){
            //changing volume 
            const cv = line.match(/\bvol\.\((\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)\)\.([\d.]+)\b/i);
            if (cv) return { min: parseFloat(cv[1]), max: parseFloat(cv[2]), period: parseFloat(cv[3]), animated:true};
            // constant vol
            const m = line.match(/\bvol\.(\d+(?:\.\d+)?)\b/i);
            if (m) return {value: parseFloat(m[1]), animated: false
                //const v = {value: parseFloat(m[1]), animated: false};
                //return Math.max(0, Math.min(100, v));
            };
            return undefined;
        }
        function parseAtt(line){
            const m = line.match(/\batt\.([\d]+)\b/i);
            return m ? parseFloat(m[1]):0.01;
        }
        function parseRel(line){
            const m = line.match(/\brel\.([\d.]+)\b/i);
            return m ? parseFloat(m[1]):0.5;
        }
        function parseMovement(str){
            const mv = str.match(/^\((\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)\)\.([\d.]+)$/);
            if (mv) return { min: parseFloat(mv[1]), max: parseFloat(mv[2]), period: parseFloat(mv[3]), animated: true};
            return { value: parseFloat(str), animated: false};
        }
        function resolveValue(v){
            if (v === null || v === undefined) return 0;
            if (!v.animated) return v.value ?? v;
            const t = (millis() /1000) % v.period;
            const norm = (Math.sin((t/v.period) *Math.PI *2 - Math.PI/2) +1)/2;
            return v.min + (v.max - v.min)*norm;
        }
        function serialiseVal(v){
            if (!v?.animated) return Math.round(v?.value ?? v);
            return `(${v.min}-${v.max}).${v.period}`;
        }
        
        function applyEffects(synth, effects){
            synth.disconnect();
            if (!effects || effects.length === 0){
                synth.toDestination();
                return;
            }
            const effectsList = effects.map(effect =>{
                if (effect === 'vibrato') return new Tone.Vibrato({frequency: 5, depth: 0.5});
                if (effect === 'distort') return new Tone.Distortion(0.8);
                if (effect === 'reverb') return new Tone.Reverb({decay:3, wet: 0.6});
                if (effect === 'chorus') return new Tone.Chorus(4, 2.5, 0.5).start();
                if (effect === 'reverse') return null;
                return null;
            }).filter(Boolean);
            if (effectsList.length === 0){synth.toDestination(); return;}
            synth.connect(effectsList[0]);
            for (let i = 0; i < effectsList.length - 1; i++) effectsList[i].connect(effectsList[i+1]);
            effectsList[effectsList.length - 1].toDestination();
        }
        
        function applyEffectsToSample(sampler, effects){
            sampler.disconnect();
            sampler.set({ reverse: effects.includes('reverse') });
            if (!effects || effects.length === 0){
                sampler.toDestination();
                return;
            }
            const effectsList = effects.map(effect =>{
                if (effect === 'vibrato') return new Tone.Vibrato({frequency: 5, depth: 0.5});
                if (effect === 'distort') return new Tone.Distortion(0.8);
                if (effect === 'reverb') return new Tone.Reverb({decay:3, wet: 0.6});
                if (effect === 'chorus') return new Tone.Chorus(4, 2.5, 0.5).start();
                return null;
            }).filter(Boolean);
            if (effectsList.length === 0){
                sampler.toDestination(); 
                return;
            }
            sampler.connect(effectsList[0]);
            for (let i = 0; i < effectsList.length-1;i++) effectsList[i].connect(effectsList[i+1]);
            effectsList[effectsList.length-1].toDestination();
        }

        function updateEnvelopeFromInside(s){
            s.attack = (s.insideX || 0.1)*2;
            s.release = (s.insideY || 0.1)*4;
        }
        function updateActivePitch(s){
            if (!s._activePitch) return;
            if (s.type === 'voice' || s.type === 'arptriangle') return;
            const noteIndex = Math.min(
                Math.floor((resolveValue(s.y)/height) * notes.length),
                notes.length - 1
            );
            const newPitch = notes[noteIndex];
            if(newPitch === s._activePitch) return;
            const vol = getEffectiveVol(s);
            if (s.type === 'square'){
                squareSynth.volume.value = vol;
                squareSynth.triggerRelease(s._activePitch);
                squareSynth.triggerAttack(newPitch);
            }
            if (s.type === 'striangle'){
                triangleSynth.volume.value = vol;
                triangleSynth.triggerRelease(s._activePitch);
                triangleSynth.triggerAttack(newPitch);
            }
            if (s.type === 'circle'){
                sineSynth.volume.value = vol;
                sineSynth.triggerRelease(s._activePitch);
                sineSynth.triggerAttack(newPitch);
            }
            if (s.type === 'diamond'){
                diamondSynth.volume.value = vol;
                diamondSynth.triggerRelease(s._activePitch);
                diamondSynth.triggerAttack(newPitch);
            }
            if (s.type === 'sawtooth'){
                sawtoothSynth.volume.value = vol;
                sawtoothSynth.triggerRelease(s._activePitch);
                sawtoothSynth.triggerAttack(newPitch);
            }
            if (s.type === 'piano'){
                pianoSample.triggerRelease(s._activePitch);
                pianoSample.triggerAttack(newPitch);
            }
            if (s.type === 'violin'){
                violinSample.triggerRelease(s._activePitch);
                violinSample.triggerAttack(newPitch);
            }
            if (s.type === 'flute'){
                fluteSample.triggerRelease(s._activePitch);
                fluteSample.triggerAttack(newPitch);
            }
            
            s._activePitch = newPitch;
        }
        //change text editor as shape moves
        function syncEditorFromShapes(){
            if (shapes.length > 0){
                document.getElementById('help-overlay').style.opacity = '0';
            }
            suppressEditorUpdate = true;
            const existingLines = editor.value.split('\n');
            const speedLine = existingLines.find(l => /^speed\s/i.test(l.trim()));
            const shapeLines = shapes.map(s => {
                const idx = Math.min(Math.floor(((resolveValue(s.y) + shapeHeight(s) / 2) / height) * notes.length), notes.length - 1);
                //const idx = Math.min(Math.floor((resolveValue(s.y)/height) * notes.length), notes.length -1);
                const labelPart = s.type === 'voice' ? ` ${s.label || 'text'}` : '';
                const v = s.vol;
                const isDefault = !v || (!v.animated && (v.value === 100|| v === 100));
                //const volPart = (s.vol !== undefined && s.vol !== 100) ? ` vol.${s.vol}` : '';
                const volPart = isDefault ? '': v.animated ? ` vol.(${v.min}-${v.max}).${v.period}`:`vol.${v.value}`;
                const attPart = (s.attack && s.attack !== 0.01) ? ` att.${parseFloat(s.attack.toFixed(2))}` : '';
                const relPart = (s.release && s.release !== 0.5) ? ` rel.${parseFloat(s.release.toFixed(2))}` : '';
                const spanStr = (s.type === 'arptriangle' && (s.span || 1) > 1) ? `.${s.span}` : '';
                const effectStr = s.effects && s.effects.length > 0 ? `.${s.effects.join('.')}` : '';
                const typeStr = `${s.type}${spanStr}${effectStr}`;
                //const typeStr = s.effects && s.effects.length > 0 ? `${s.type}.${s.effects.join('.')}` : s.type;
                return `${typeStr} (${serialiseVal(s.x)},${serialiseVal(s.y)}) ${serialiseVal(s.w)}${labelPart}${volPart}${attPart}${relPart} //${notes[idx]}`;
                //return `${typeStr} (${serialiseVal(s.x)},${serialiseVal(s.y)}) ${serialiseVal(s.w)}${labelPart}${volPart} //${notes[idx]}`;
                //return `${s.type} ${(s.x/width).toFixed(4)} ${(s.y/height).toFixed(4)} ${(s.w/width).toFixed(4)}${labelPart}${volPart} //${notes[idx]}`;
                //return `${s.type} (${Math.round(s.x)},${Math.round(s.y)}) ${Math.round(s.w)}${labelPart}${volPart} //${notes[idx]}`;
                //return `${s.type} ${Math.round(s.x)} ${Math.round(s.y)} ${Math.round(s.w)}${labelPart} //${notes[idx]}`;
            }).join('\n');
            editor.value = speedLine ? speedLine + '\n' + shapeLines : shapeLines;
            /*editor.value = shapes.map(s => {
                const idx = Math.min(Math.floor((s.y/height) * notes.length), notes.length - 1);
                return `${s.type} ${Math.round(s.x)} ${Math.round(s.y)} // ${notes[idx]}`;
            }).join('\n');*/
            suppressEditorUpdate = false;
            resizeEditor();
        }

        function splitCoordPair(token){
            if (!token || token[0] !== '(' || token[token.length - 1] !== ')') return null;

            let depth = 0;
            for (let i = 0; i < token.length; i++){
                const ch = token[i];
                if (ch === '(') depth++;
                else if (ch === ')') depth--;
                else if (ch === ',' && depth === 1){
                    return [
                        token.slice(1, i),
                        token.slice(i + 1, -1)
                    ];
                }
            }
            return null;
        }
    
        //move shapes as text editor changes
        function syncShapesFromEditor(){
            if (suppressEditorUpdate) return;
            activeShapes.forEach(i => {if (shapes[i]) triggerRelease(shapes[i]);});
            activeShapes.clear();
            parseSpeedFromEditor();
            shapes = editor.value.split('\n')
            .map(line => line.replace(/\/\/.*$/, '').trim())
            .filter(line => line.length >0 && !/^speed\s/i.test(line))
            .map(line => {
                //const [type, x, y, w] = line.split(/\s+/);
                //return {type: (type||'').toLowerCase(), x: parseFloat(x), y: parseFloat(y), w: parseFloat(w) || 100};
                const withoutComment = line.replace(/\/\/.*$/,'').trim();
                const volVal = parseVol(withoutComment);
                const attVal = parseAtt(withoutComment);
                const relVal = parseRel(withoutComment);
                const cleanedRaw = withoutComment
                    .replace(/\bvol\.\(\d+(?:\.\d+)?-\d+(?:\.\d+)?\)\.\d+(?:\.\d+)?/gi, '')
                    .replace(/\bvol[\.\d]*/gi,'')
                    .replace(/\s+/g,' ').trim();
                const parts = cleanedRaw.split(/\s+/);
                const rawType = (parts[0] || '').toLowerCase();
                const typeParts = rawType.split('.');
                const type = typeParts[0];
                let span = 1;
                const createdEffects = typeParts.slice(1).filter(p =>{
                    if (type === 'arptriangle' && /^\d+$/.test(p)) {
                        span = parseInt(p);
                        return false;
                    }
                    return true;
                });
                //const createdEffects = typeParts.slice(1);
                const coordPair = splitCoordPair(parts[1]);
                let x, y, w, label;

                if (coordPair) {
                    x = parseMovement(coordPair[0]);
                    y = parseMovement(coordPair[1]);
                    w = parts[2] ? parseMovement(parts[2]) : { value: 100, animated: false };
                    label = type === 'voice' ? (parts[3] || 'text') : undefined;
                } else {
                    x = parts[1] ? parseMovement(parts[1]) : { value: 0, animated: false };
                    y = parts[2] ? parseMovement(parts[2]) : { value: 0, animated: false };
                    w = parts[3] ? parseMovement(parts[3]) : { value: 100, animated: false };
                    label = type === 'voice' ? (parts[4] || 'text') : undefined;
                }
                //const coordsMatch = (parts[1] || '').match(/^\(([^,]+),([^)]+)\)$/);
                //const x = coordsMatch ? parseMovement(coordsMatch[1]) : {value:parseFloat(parts[1]), animated:false};
                //const y = coordsMatch ? parseMovement(coordsMatch[2]) : {value:parseFloat(parts[2]), animated:false};
                //const w = parseMovement(coordsMatch ? parts[2] : parts[3]) || {value: 100, animated: false};
                //const x = coordsMatch ? parseFloat(coordsMatch[1]) : parseFloat(parts[1]);
                //const y = coordsMatch ? parseFloat(coordsMatch[2]) : parseFloat(parts[2]);
                //const w = parseFloat(coordsMatch ? parts[2] : parts[3]) || 100;
                //const label = type === 'voice' ? (coordsMatch ? parts[3] : parts[4] || 'text'): undefined;
                const isFraction = x <= 1 && y <= 1 && w <= 1;
                const oldShape = shapes.find(os =>
                    os.type === type &&
                    Math.abs(resolveValue(os.x) - resolveValue(x)) < 2 &&
                    Math.abs(resolveValue(os.y) - resolveValue(y)) <2
                );
                return {
                    type,
                    span,
                    effects: createdEffects,
                    x,
                    y,
                    w,
                    label,
                    insideX: oldShape?.insideX ?? 0.5,
                    insideY: oldShape?.insideY ?? 0.5,
                    vol: volVal !== undefined ? volVal: {value: 100, animated:false},
                    attack: attVal,
                    release: relVal,
                    _lastFxKey: oldShape?._lastFxKey ?? null
                    //_lastFxKey : null
                };
                /*const x = parseFloat(parts[1]);
                const y = parseFloat(parts[2]);
                const w = parseFloat(parts[3]) || 100;
                const label = type === 'voice' ? (parts[4] || 'text'): undefined;
                return {type, x, y, w , label};*/
            })
            .filter(s=>
            ['square', 'triangle', 'circle', 'arptriangle', 'diamond', 'sawtooth', 'voice', 'piano', 'violin', 'flute'].includes(s.type)
            && !isNaN(resolveValue(s.x)) && !isNaN(resolveValue((s.y)) && !isNaN(resolveValue(s.w))
            //&& !isNaN(resolveValue(s.x)) && !isNaN(resolveValue((s.y)) && !isNaN(resolveValue(s.w))
            ));
        }
        editor.addEventListener('input', syncShapesFromEditor);
        //highlight code
        function highlightEditorLine(index){
            const lines = editor.value.split('\n');
            let lineNumber = index;
            if (lines.length > 0 && /^speed\s/i.test(lines[0].trim())){
                lineNumber += 1;
            }
            if (lineNumber < 0|| lineNumber >= lines.length) return;
            const start = lines
                .slice(0, lineNumber)
                .join('\n').length + (lineNumber > 0 ? 1 : 0);
            const end = start + lines[lineNumber].length;
            editor.focus();
            editor.setSelectionRange(start, end);
        }

        function resizeEditor(){
            editor.style.height = 'auto';
            editor.style.height = editor.scrollHeight + 'px';
        }
        editor.addEventListener('input', resizeEditor);
        //copy button
        document.getElementById('copy-button').addEventListener('click',
        function(){
            navigator.clipboard.writeText(editor.value).then(() =>{
                this.textContent = 'Copied!';
                this.classList.add('copied');
                setTimeout(() => {
                    this.textContent = 'copy';
                    this.classList.remove('copied');
                }, 1500);
            });
        });
        //pause play
        //let playing = true;
        document.getElementById('pause-play').addEventListener('click', function(){
            playing = !playing;
            this.textContent = playing ? 'pause': 'play';
        });
        //delete
        document.getElementById('delete-button').addEventListener('click', function(){
            shapes = [];
            voiceIndex = -1;
            activeShapes.clear();
            editor.value = '';
            this.textContent = 'Deleted!';
            this.classList.add('deleted');
            setTimeout(() =>{
                this.textContent = 'delete';
                this.classList.remove('deleted');
            }, 1500);
            });
        //save
        document.getElementById('save-button').addEventListener('click', function(){
            const text = editor.value;
            const blob = new Blob([text], {type: 'text/plain'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'music.txt';
            a.click();
            URL.revokeObjectURL(url);
            this.textContent = 'Saved!';
            this.classList.add('saved');
            setTimeout(() => {
                this.textContent = 'save';
                this.classList.remove('saved');
            }, 1500);
        });
        //load file
        document.getElementById('load-button').addEventListener('click', function(){
            document.getElementById('file-input').click();
        })

        document.getElementById('file-input').addEventListener('change', function(){
            const file = this.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e){
                editor.value = e.target.result;
                syncShapesFromEditor();
            };
            reader.readAsText(file);
            this.value = '';
        });

        document.getElementById('new-page-button').addEventListener('click', function(){
            totalPages++;
            resizeCanvas(windowWidth * totalPages, pageHeight);
        });
        
        document.getElementById('mute-button').addEventListener('click', function(){
            muted = !muted;
            const vol = muted ? -Infinity :0;
            squareSynth.volume.value = vol;
            triangleSynth.volume.value = vol;
            sineSynth.volume.value = vol;
            sawtoothSynth.volume.value = vol;
            arpSynth.volume.value = vol;
            diamondSynth.volume.value = vol;
            if (pianoSample) pianoSample.volume.value = vol;
            if (violinSample) violinSample.volume.value = vol;
            if (fluteSample) fluteSample.volume.value = vol;
            this.textContent = muted ? 'unmute' : 'mute';
        });
        document.getElementById('sketch').addEventListener('scroll',function(){
            scrollX = this.scrollLeft /zoomLevel;
            scrollY = this.scrollTop;
        });
        document.getElementById('restart-button').addEventListener('click', function(){
            scanline = 0;
        });

        editor.addEventListener('mousedown', () => {canvasFocus = false;});
        editor.addEventListener('focus',() => {canvasFocus=false;});

            if (e.key === 'Enter') {
                const cmd = this.value.trim().toLowerCase();
                if (cmd === 'square' || cmd === 'triangle' || cmd === 'circle') {
                    shapes.push({ type: cmd, x: width / 2, y: height / 2 });
                }
                this.value = '';
            }});*/
    </script>
